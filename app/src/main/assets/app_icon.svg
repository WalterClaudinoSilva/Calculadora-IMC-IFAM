<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ícone IFAM</title>
  <desc id="desc">Ícone vetorial com símbolo do Instituto Federal nas cores institucionais verde e vermelho.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>

  <!-- Símbolo IFAM / Instituto Federal -->
  <g transform="translate(107 55)" filter="url(#shadow)">
    <!-- círculo vermelho institucional -->
    <circle cx="44" cy="44" r="44" fill="#CD191E"/>

    <!-- módulos verdes institucionais -->
    <g fill="#2F9E41">
      <!-- linha 1 -->
      <rect x="104" y="0" width="88" height="88" rx="10"/>
      <rect x="208" y="0" width="88" height="88" rx="10"/>

      <!-- linha 2 -->
      <rect x="0" y="104" width="88" height="88" rx="10"/>
      <rect x="104" y="104" width="88" height="88" rx="10"/>

      <!-- linha 3 -->
      <rect x="0" y="208" width="88" height="88" rx="10"/>
      <rect x="104" y="208" width="88" height="88" rx="10"/>
      <rect x="208" y="208" width="88" height="88" rx="10"/>

      <!-- linha 4 -->
      <rect x="0" y="312" width="88" height="88" rx="10"/>
      <rect x="104" y="312" width="88" height="88" rx="10"/>
    </g>
  </g>

  <!-- Identificação curta para uso como app icon -->
  <text x="256" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#000000" letter-spacing="2">IFAM</text>
</svg>
